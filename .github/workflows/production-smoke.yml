name: production-smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel
        run: sleep 20
      - name: Probe production root
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/body.html -w "%{http_code}" --max-time 30 https://shtab-tochka.vercel.app/)
          echo "HTTP=$code"
          head -c 500 /tmp/body.html || true
          echo
          test "$code" = "200"
          grep -q "Центр управления" /tmp/body.html
