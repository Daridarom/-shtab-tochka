name: production-smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel
        run: sleep 5
      - name: Probe production root and API
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/body.html -w "%{http_code}" --max-time 30 https://shtab-tochka.vercel.app/)
          echo "ROOT_HTTP=$code"
          head -c 300 /tmp/body.html || true
          echo
          test "$code" = "200"
          grep -q "Центр управления" /tmp/body.html
          api=$(curl -L -sS -o /tmp/state.json -w "%{http_code}" --max-time 30 https://shtab-tochka.vercel.app/api/state)
          echo "STATE_HTTP=$api"
          head -c 500 /tmp/state.json || true
          echo
          test "$api" = "200"
          grep -q '"metrics"' /tmp/state.json
          grep -q '"mode":"live"' /tmp/state.json
          js=$(curl -L -sS -o /tmp/app.js -w "%{http_code}" --max-time 30 https://shtab-tochka.vercel.app/app.js?v=10)
          echo "APP_JS_HTTP=$js"
          test "$js" = "200"
          grep -q "nav button" /tmp/app.js
          health=$(curl -L -sS -o /tmp/health.json -w "%{http_code}" --max-time 30 https://shtab-tochka.vercel.app/api/health)
          echo "HEALTH_HTTP=$health"
          cat /tmp/health.json
          test "$health" = "200"
          grep -q '"liveConfigured":true' /tmp/health.json
