<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ЦУП · UX-макет</title>
<style>
:root{--bg:#0f171b;--card:#182229;--card2:#202d35;--text:#f3f6f7;--muted:#98a8b2;--line:#30404a;--accent:#8fe0c0;--accentText:#0d2a20;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:16px}.app{max-width:720px;margin:auto;min-height:100vh;padding:16px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accentText);display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small,.muted{color:var(--muted)}button,select,input{font:inherit;color:inherit}.theme{width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:13px}.note,.card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px}.note{color:var(--muted);font-size:13px;margin-bottom:18px}.headline{margin:8px 0 18px}.headline small{color:var(--muted);text-transform:uppercase;letter-spacing:1px}.headline h1{font-size:28px;margin:4px 0}.card{margin-bottom:14px}.card h2{font-size:18px;margin:0 0 10px}.hero{background:linear-gradient(135deg,var(--card2),var(--card))}.time{font-size:40px;font-weight:800;line-height:1;margin:10px 0 4px}.primary,.secondary{min-height:46px;border:0;border-radius:13px;padding:10px 14px;font-weight:700}.primary{background:var(--accent);color:var(--accentText)}.secondary{background:var(--card2);border:1px solid var(--line)}.full{width:100%}.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.num{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}.row b{display:block}.row small{display:block;color:var(--muted);margin-top:3px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}.day{min-height:68px;border:1px solid var(--line);background:var(--card);border-radius:12px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.day small{color:var(--muted);font-size:11px}.day.active{background:var(--accent);color:var(--accentText);border-color:transparent}.day.active small{color:inherit;opacity:.75}.event{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.event:first-of-type{border-top:0}.event-time{font-weight:800;width:48px}.event-body{border-left:2px solid var(--accent);padding-left:12px}.event-body small{display:block;color:var(--muted);margin-top:4px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}.seg button{border:0;background:transparent;min-height:42px;border-radius:10px;color:var(--muted);font-weight:700}.seg button.active{background:var(--card2);color:var(--text)}.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}.col{min-width:86%;scroll-snap-align:start}.colhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.task{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.task h3{margin:4px 0 0;font-size:16px}.task small{color:var(--muted)}.task-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.task-actions button{min-height:42px;border:1px solid var(--line);background:var(--card2);border-radius:11px}.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quad{min-height:138px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left}.quad b{display:block;margin-bottom:4px}.quad small{color:var(--muted)}.count{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:var(--card2);margin-top:16px;font-weight:800}.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 7px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav{border:0;background:transparent;min-height:60px;color:var(--muted);font-size:11px;border-radius:12px}.nav strong{display:block;font-size:20px;line-height:1.15}.nav.active{background:var(--card);color:var(--accent)}.hidden{display:none!important}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#111c21;border:1px solid var(--line);border-radius:13px;padding:10px 14px;z-index:50;box-shadow:0 10px 30px #0007;max-width:90%;font-size:13px}.light{--bg:#f2f5f3;--card:#fff;--card2:#e8eeea;--text:#17221c;--muted:#617168;--line:#d4ddd7;--accent:#205e4c;--accentText:#fff;color-scheme:light}.sheet{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -20px 60px #0008}.sheet h3{margin:2px 0 10px}.sheet select{width:100%;min-height:46px;border-radius:12px;background:var(--card2);border:1px solid var(--line);padding:8px;margin:8px 0 12px}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}input{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:10px 12px;margin-bottom:10px}@media(min-width:700px){.col{min-width:48%}}
</style></head><body>
<div class="app"><header class="top"><div class="brand"><div class="logo">Ц</div><div><b>ЦУП</b><small>мобильный UX-макет</small></div></div><button class="theme" id="theme">◐</button></header><div class="note">Безопасный макет: демонстрационные события и задачи. Рабочий ЦУП не меняется, личные данные календаря здесь не публикуются.</div><main id="main"></main></div><nav class="bottom" id="nav"></nav><div class="toast hidden" id="toast"></div><div class="sheet hidden" id="sheet"></div>
<script>
(function(){
var tab='today',projectView='list',selectedDay='29';
var tasks=[{id:1,title:'Подготовить материалы к встрече',project:'Рабочий контур',status:'todo',priority:'do'},{id:2,title:'Проверить синхронизацию календаря',project:'AI Штаб',status:'doing',priority:'do'},{id:3,title:'Собрать документы по проекту',project:'Проект',status:'wait',priority:'schedule'},{id:4,title:'Разобрать идеи для нового прототипа',project:'Лаборатория',status:'todo',priority:'later'}];
var events={'28':[{t:'18:00',title:'Контрольная точка',type:'онлайн'}],'29':[{t:'11:00',title:'Рабочая встреча',type:'онлайн'},{t:'14:00',title:'Заседание штаба',type:'очно'}],'30':[{t:'10:30',title:'Созвон по проекту',type:'онлайн'}]};
var tabs=[['today','Сегодня','⌂'],['calendar','Календарь','▦'],['projects','Проекты','▤'],['systems','Системы','⚙'],['inbox','Входящие','＋']];
function qs(s){return document.querySelector(s)}function toast(t){var n=qs('#toast');n.textContent=t;n.classList.remove('hidden');setTimeout(function(){n.classList.add('hidden')},1700)}function title(k,h,s){return '<div class="headline"><small>'+k+'</small><h1>'+h+'</h1>'+(s?'<div class="muted">'+s+'</div>':'')+'</div>'}
function today(){return title('Понедельник · 28 сентября','Сегодня','Сначала то, что требует твоего внимания.')+'<section class="card hero"><span class="muted">Ближайшее событие</span><div class="time">18:00</div><h2>Контрольная точка</h2><div class="muted">Онлайн · демонстрационное событие</div><button class="primary full" style="margin-top:14px" data-go="calendar">Открыть календарь</button></section><section class="card"><h2>3 главных действия</h2>'+tasks.slice(0,3).map(function(x,i){return '<div class="row"><div class="num">'+(i+1)+'</div><div><b>'+x.title+'</b><small>'+x.project+'</small></div></div>'}).join('')+'</section><section class="card"><h2>Состояние данных</h2><div class="row"><div class="num">✓</div><div><b>Календарь</b><small>В рабочей версии здесь будет последняя успешная синхронизация.</small></div></div><div class="row"><div class="num">•</div><div><b>Задачи</b><small>Один набор данных для списка, доски и матрицы.</small></div></div></section>'}
function calendar(){var days=[['28','Пн'],['29','Вт'],['30','Ср'],['1','Чт'],['2','Пт'],['3','Сб'],['4','Вс']],list=events[selectedDay]||[];return title('Неделя','Календарь','На телефоне важнее день и ближайшие события.')+'<div class="week">'+days.map(function(d){return '<button class="day '+(selectedDay===d[0]?'active':'')+'" data-day="'+d[0]+'"><small>'+d[1]+'</small><b>'+d[0]+'</b></button>'}).join('')+'</div><section class="card"><h2>'+selectedDay+' сентября</h2>'+(list.length?list.map(function(e){return '<div class="event"><div class="event-time">'+e.t+'</div><div class="event-body"><b>'+e.title+'</b><small>'+e.type+' · окончание не указано</small></div></div>'}).join(''):'<div class="muted">Событий в макете нет. В рабочем ЦУПе это не должно означать «день свободен», пока источник не подтверждён.</div>')+'</section>'}
function taskCard(x){return '<div class="task"><small>'+x.project+'</small><h3>'+x.title+'</h3><div class="task-actions"><button data-task="'+x.id+'">Изменить</button><button data-next="'+x.id+'">Следующий этап</button></div></div>'}
function projects(){var top='<div class="seg"><button data-view="list" class="'+(projectView==='list'?'active':'')+'">Список</button><button data-view="board" class="'+(projectView==='board'?'active':'')+'">Доска</button><button data-view="matrix" class="'+(projectView==='matrix'?'active':'')+'">Приоритеты</button></div>',body='';if(projectView==='list')body='<section>'+tasks.map(taskCard).join('')+'</section>';if(projectView==='board'){var sts=[['todo','К делу'],['doing','В работе'],['wait','Ожидаю'],['done','Готово']];body='<div class="board">'+sts.map(function(s){return '<section class="col"><div class="colhead"><b>'+s[1]+'</b><span class="muted">'+tasks.filter(function(x){return x.status===s[0]}).length+'</span></div>'+tasks.filter(function(x){return x.status===s[0]}).map(taskCard).join('')+'</section>'}).join('')+'</div>'}if(projectView==='matrix'){var q=[['do','Сделать','важно и срочно'],['schedule','Запланировать','важно, не срочно'],['delegate','Делегировать','срочно, менее важно'],['later','Отложить','не срочно']];body='<div class="matrix">'+q.map(function(a){return '<button class="quad"><b>'+a[1]+'</b><small>'+a[2]+'</small><span class="count">'+tasks.filter(function(x){return x.priority===a[0]}).length+'</span></button>'}).join('')+'</div>'}return title('Один реестр','Проекты','Статус, срок и приоритет не смешиваются.')+top+body}
function systems(){return title('Диагностика','Системы','Техническое состояние вынесено из главного рабочего экрана.')+'<section class="card"><h2>Источники</h2><div class="row"><div class="num">1</div><div><b>Календарь</b><small>Последняя успешная синхронизация и понятная ошибка при сбое.</small></div></div><div class="row"><div class="num">2</div><div><b>Задачи</b><small>Один реестр, разные представления.</small></div></div><div class="row"><div class="num">3</div><div><b>Документы</b><small>Связь с задачами и проектами без публикации приватных данных.</small></div></div></section>'}
function inbox(){return title('Быстрый захват','Входящие','Идея превращается в задачу, а не теряется в чате.')+'<section class="card"><h2>Новая задача</h2><input id="newTask" placeholder="Например: позвонить партнёру"><button class="primary full" id="addTask">Добавить в макет</button></section>'}
function render(){qs('#main').innerHTML=({today:today,calendar:calendar,projects:projects,systems:systems,inbox:inbox}[tab])();qs('#nav').innerHTML=tabs.map(function(t){return '<button class="nav '+(tab===t[0]?'active':'')+'" data-tab="'+t[0]+'"><strong>'+t[2]+'</strong>'+t[1]+'</button>'}).join('')}
function openTask(id){var x=tasks.find(function(t){return t.id===id});if(!x)return;qs('#sheet').innerHTML='<h3>'+x.title+'</h3><div class="muted">'+x.project+'</div><label class="muted">Статус</label><select id="statusSel"><option value="todo">К делу</option><option value="doing">В работе</option><option value="wait">Ожидаю</option><option value="done">Готово</option></select><label class="muted">Приоритет</label><select id="prioritySel"><option value="do">Сделать</option><option value="schedule">Запланировать</option><option value="delegate">Делегировать</option><option value="later">Отложить</option></select><div class="sheet-actions"><button class="secondary" id="closeSheet">Отмена</button><button class="primary" id="saveSheet">Сохранить</button></div>';qs('#statusSel').value=x.status;qs('#prioritySel').value=x.priority;qs('#sheet').dataset.task=id;qs('#sheet').classList.remove('hidden')}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.go){tab=b.dataset.go;render()}else if(b.dataset.day){selectedDay=b.dataset.day;render()}else if(b.dataset.view){projectView=b.dataset.view;render()}else if(b.dataset.task){openTask(Number(b.dataset.task))}else if(b.dataset.next){var x=tasks.find(function(t){return t.id===Number(b.dataset.next)}),o=['todo','doing','wait','done'];x.status=o[(o.indexOf(x.status)+1)%o.length];render();toast('Статус изменён только в макете')}else if(b.id==='closeSheet'){qs('#sheet').classList.add('hidden')}else if(b.id==='saveSheet'){var x=tasks.find(function(t){return t.id===Number(qs('#sheet').dataset.task)});x.status=qs('#statusSel').value;x.priority=qs('#prioritySel').value;qs('#sheet').classList.add('hidden');render();toast('Изменение применено в макете')}else if(b.id==='addTask'){var input=qs('#newTask'),val=input.value.trim();if(val){tasks.push({id:Date.now(),title:val,project:'Входящие',status:'todo',priority:'later'});input.value='';toast('Задача добавлена в макет')}}});qs('#theme').addEventListener('click',function(){document.body.classList.toggle('light')});render();
})();
</script></body></html>
